name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to publish (for example, 1.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run lint checks
        run: |
          ruff check src/
          ruff format --check src/
      - name: Run tests or smoke test
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/
          else
            python -c "import discord_cli; print(discord_cli.__version__)"
          fi

  release:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semantic_release.outputs.released }}
      version: ${{ steps.semantic_release.outputs.version }}
      tag: ${{ steps.semantic_release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Configure Git for semantic-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release (version + changelog + tag)
        id: semantic_release
        run: |
          # --no-vcs-release: the "Create GitHub Release" step below owns
          # publishing the release so it can attach the built distributions.
          python -m semantic_release version --no-vcs-release
          # Check if a new version was released
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$(python -c 'import discord_cli; print(discord_cli.__version__)')" >> $GITHUB_OUTPUT
            echo "tag=v$(python -c 'import discord_cli; print(discord_cli.__version__)')" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi
      - name: Build distribution
        if: steps.semantic_release.outputs.released == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.semantic_release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: steps.semantic_release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.semantic_release.outputs.tag }}" \
            --title "${{ steps.semantic_release.outputs.tag }}" \
            --notes-file CHANGELOG.md \
            dist/*.whl dist/*.tar.gz

      # The Scoop manifest pins a wheel URL and its sha256, neither of which
      # exists until PyPI has accepted the upload, so it cannot be part of the
      # release commit the way the other version-bearing files are. It is
      # refreshed here instead and pushed back to main as a chore(), which the
      # commit parser maps to no release and therefore cannot loop.
      - name: Update the Scoop manifest from PyPI
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          python scripts/update_scoop_manifest.py \
            --version "${{ steps.semantic_release.outputs.version }}"

      - name: Commit the refreshed Scoop manifest
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          if git diff --quiet -- packaging/scoop/discordcli-agents.json; then
            echo "Scoop manifest already current; nothing to commit."
            exit 0
          fi
          git add packaging/scoop/discordcli-agents.json
          git commit -m "chore(scoop): update manifest to ${{ steps.semantic_release.outputs.version }}"
          # Push by explicit refspec so this works whether or not the checkout
          # and semantic-release left HEAD attached to a local main.
          git push origin HEAD:main

  publish-existing-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the requested version
        run: |
          test "$(python -c 'from pathlib import Path; namespace = {}; exec(Path("src/discord_cli/__init__.py").read_text(), namespace); print(namespace["__version__"])')" = "${{ inputs.version }}"
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ inputs.version }}" >/dev/null 2>&1 || \
            gh release create "v${{ inputs.version }}" \
              --title "v${{ inputs.version }}" \
              --generate-notes \
              dist/*.whl dist/*.tar.gz

      # This job is checked out detached at the tag, so the manifest update has
      # to happen against a separate, writable checkout of main. Without it a
      # dispatch-triggered publish would leave the manifest behind.
      - name: Check out main to update the Scoop manifest
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-checkout
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Update and commit the Scoop manifest
        working-directory: main-checkout
        run: |
          # Exit 3 means the dispatch re-published a version older than the one
          # the manifest already pins. That is a legitimate thing to do, so leave
          # the manifest pointing at the newer release rather than failing.
          set +e
          python scripts/update_scoop_manifest.py --version "${{ inputs.version }}"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "Requested version predates the pinned one; leaving the manifest alone."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if git diff --quiet -- packaging/scoop/discordcli-agents.json; then
            echo "Scoop manifest already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/scoop/discordcli-agents.json
          git commit -m "chore(scoop): update manifest to ${{ inputs.version }}"
          git push origin HEAD:main
