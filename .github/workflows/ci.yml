name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint source
        run: ruff check src/
      - name: Check formatting
        run: ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Type-check core modules
        run: >-
          mypy
          src/discord_cli/config.py
          src/discord_cli/errors.py
          src/discord_cli/manpage.py
          src/discord_cli/output.py
          src/discord_cli/registry.py

  manpage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Verify the committed man page is up to date
        run: |
          python -m discord_cli.manpage > /tmp/discord-cli.1
          diff -u docs/man/discord-cli.1 /tmp/discord-cli.1 || {
            echo "::error::docs/man/discord-cli.1 is stale. Regenerate it with: python -m discord_cli.manpage > docs/man/discord-cli.1"
            exit 1
          }
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Lint the man page roff source
        run: mandoc -T lint -W warning docs/man/discord-cli.1

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: pip install -e ".[dev]"
      - name: Run tests or smoke test with coverage enforcement
        id: run-tests
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            # generate XML for reporting and fail if coverage < 80%%
            python -m pytest tests/ --cov=discord_cli --cov-report=xml --cov-report=term-missing --cov-fail-under=80
          else
            python -c "import discord_cli; print(discord_cli.__version__)"
          fi
      - name: Prepare coverage artifact
        shell: bash
        run: |
          # Move coverage.xml to a named artifact per matrix axis if present
          if [ -f coverage.xml ]; then
            mv coverage.xml coverage-${{ matrix.os }}.xml
            ls -la coverage-${{ matrix.os }}.xml || true
          else
            echo "No coverage.xml found (skipping artifact upload)"
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.xml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  coverage-report:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          # download all coverage artifacts produced by matrix test jobs
          path: ./coverage_reports
      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Contents of coverage_reports:" && ls -la coverage_reports || true
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: './coverage_reports/**/*.xml'
          # don't fail the CI solely because Codecov could not be contacted or token missing
          fail_ci_if_error: false

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, manpage, test, build, coverage-report]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.manpage.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.coverage-report.result }}" = success
